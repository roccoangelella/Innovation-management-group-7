name: Production patent labeling - Kaggle dual T4
# W&B monitor uses pip --target (not venv/ensurepip) on Kaggle Python 3.13.
# Launch retries are bounded; accept only a confirmed Kaggle submission.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle_production.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kaggle-full-patent-production
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      kernel_id: ${{ steps.execution.outputs.kernel_id }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle and Hugging Face clients
        run: python -m pip install --disable-pip-version-check --upgrade kaggle six huggingface-hub==1.31.0
      - name: Check secure credentials
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::Missing KAGGLE_API_TOKEN"; exit 1; }
          test -n "$HF_TOKEN" || { echo "::error::Missing HF_TOKEN (private model required)"; exit 1; }
      - name: Resolve authenticated Kaggle account
        run: |
          kaggle kernels init -p kaggle/production_kernel
          python - <<'PY'
          import json, os
          from pathlib import Path
          meta = json.loads(Path("kaggle/production_kernel/kernel-metadata.json").read_text())
          owner = meta["id"].split("/", 1)[0]
          if not owner or owner.lower() in ("username", "user"):
              raise RuntimeError("Could not resolve Kaggle owner from API credentials")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("KAGGLE_OWNER=" + owner + "\n")
          print("Authenticated Kaggle owner:", owner)
          PY
      - name: Provision private pinned Decider checkpoint on Kaggle
        env:
          MODEL_ID: perplexity-ai/pplx-decider-flash-v1.2
          MODEL_REV: 6d771ad7b5ecff5e93b8fc7b90d4c5ccc341954d
        run: |
          set -euo pipefail
          data_ref="$KAGGLE_OWNER/pplx-decider-flash-private-v12"
          # Previous run successfully uploaded the private dataset. Do not
          # repeat a multi-GB transfer because GetDatasetStatus returned 403.
          for attempt in $(seq 1 12); do
            if kaggle datasets files "$data_ref" --page-size 200 > /tmp/model_files.txt 2>&1; then
              echo "Private model dataset accessible: $data_ref"
              head -6 /tmp/model_files.txt
              break
            fi
            echo "Private dataset not listed yet (attempt $attempt)."
            if [ "$attempt" -eq 12 ]; then
              cat /tmp/model_files.txt
              echo "::error::Previously uploaded Kaggle private model cannot yet be read via API."
              exit 1
            fi
            sleep 15
          done
          if false; then
            echo "Mirroring pinned private Hugging Face checkpoint into owner-only Kaggle dataset"
            python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from huggingface_hub import snapshot_download

          src = Path("hf_snapshot").resolve()
          snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              revision=os.environ["MODEL_REV"],
              local_dir=str(src),
              token=os.environ["HF_TOKEN"],
          )
          dest = Path("model_mirror").resolve()
          dest.mkdir(exist_ok=True)
          mapping = []
          for path in sorted(src.rglob("*")):
              if not path.is_file() or ".cache" in path.parts:
                  continue
              relative = path.relative_to(src).as_posix()
              flat = hashlib.sha256(relative.encode()).hexdigest()[:20] + path.suffix
              os.link(path, dest / flat)
              mapping.append({"path":relative, "flat_name":flat})
          if not any(x["path"] == "requirements.txt" for x in mapping):
              raise RuntimeError("Checkpoint is missing requirements.txt")
          if not any(x["path"].startswith("source/src/") for x in mapping):
              raise RuntimeError("Checkpoint is missing model source")
          (dest / "snapshot_manifest.json").write_text(json.dumps(mapping,indent=2)+"\n")
          (dest / "dataset-metadata.json").write_text(json.dumps({
              "id":os.environ["KAGGLE_OWNER"]+"/pplx-decider-flash-private-v12",
              "title":"Private pinned Decider Flash model",
              "licenses":[{"name":"other"}],
              "description":"Private restricted model copy for the authorized account holder; original upstream terms apply."
          }))
          print("Private checkpoint mirror contains",len(mapping),"files", flush=True)
          PY
            kaggle datasets create -p model_mirror -r skip --keep-tabular
            echo "Private checkpoint dataset created; API may take time to index it."
          fi
      - name: Ensure previous Kaggle screening session has stopped
        run: |
          set -euo pipefail
          status="$(kaggle kernels status "$KAGGLE_OWNER/humanoid-patent-production-dual-t4")"
          echo "$status"
          [[ "$status" == *"KernelWorkerStatus.COMPLETE"* ]] || {
            echo "::error::Previous screening session is still active or failed; refusing a concurrent launch"
            exit 1
          }
      - name: Recover original durable GitHub Actions checkpoint
        uses: actions/download-artifact@v4
        with:
          name: humanoid-dual-t4-production-output
          run-id: 43012383316
          github-token: ${{ github.token }}
          path: recovered_checkpoint
      - name: Validate original source and both resumable worker journals
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          paths = [Path("recovered_checkpoint")/x for x in ("humanoid-checkpoint.zip","session_summary.json")]
          if not all(p.is_file() for p in paths):
              raise RuntimeError("Checkpoint or session summary missing from original Actions artifact")
          with zipfile.ZipFile("/tmp/complete-original-checkpoint.zip","w",zipfile.ZIP_STORED) as z:
              for p in paths:
                  z.write(p,arcname=p.name)
          PY
          python kaggle/validate_resume.py /tmp/complete-original-checkpoint.zip humanoid_patents_en.zip /tmp/validated-resume-dataset
      - name: Publish validated checkpoint to private Kaggle dataset
        run: |
          set -euo pipefail
          dataset="$KAGGLE_OWNER/humanoid-production-resume-43012383316"
          # Run 43071759641 already submitted this PRIVATE dataset, but
          # Kaggle returned HTTP 403 while immediately listing its files.
          # Never upload again or overwrite an unverified checkpoint.
          # Kaggle automatically EXPANDS uploaded ZIP datasets. The prior
          # verified upload is therefore six journal/manifest files, not a
          # literal humanoid-checkpoint.zip. Never recreate or overwrite it.
          verified=0
          for attempt in $(seq 1 30); do
            if kaggle datasets files "$dataset" > /tmp/resume_dataset_files.txt 2>&1; then
              python - <<'PY'
          from pathlib import Path
          lines=Path("/tmp/resume_dataset_files.txt").read_text().splitlines()[2:]
          observed={line.split()[0]:int(line.split()[1]) for line in lines if len(line.split())>=2 and line.split()[1].isdigit()}
          expected={"production_manifest.json","session_summary.json"}
          expected|={f"worker_{i}/{name}" for i in (0,1) for name in ("predictions.jsonl","run_metadata.json")}
          if set(observed)!=expected or any(observed[p]<=0 for p in expected):
              raise SystemExit(f"Private checkpoint layout or file sizes invalid: {observed}")
          print("PRIVATE_EXPANDED_CHECKPOINT_VERIFIED",observed,flush=True)
          PY
              verified=1
              break
            fi
            echo "Private resume dataset not readable (attempt $attempt/30); waiting for Kaggle indexing"
            sleep 20
          done
          if [ "$verified" -ne 1 ]; then
            echo "::error::Kaggle cannot read the previously submitted PRIVATE checkpoint dataset. Do not overwrite it; check account/API dataset permissions and owner-side visibility."
            tail -12 /tmp/resume_dataset_files.txt
            exit 1
          fi
          echo "Previously submitted private checkpoint dataset is readable:"
          head -10 /tmp/resume_dataset_files.txt
      - name: Create single-run PRIVATE Kaggle credential mount for direct W&B logging
        run: |
          set -euo pipefail
          if [ -z "$WANDB_API_KEY" ]; then
            echo "::error::GitHub WANDB_API_KEY secret is missing"
            exit 1
          fi
          umask 077
          mkdir -p wandb_private
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("wandb_private")
          secret = os.environ["WANDB_API_KEY"]
          if len(secret.strip()) < 20:
              raise ValueError("W&B key format is unexpectedly short")
          token_file = root / "wandb_auth_token.txt"
          token_file.write_text(secret.strip(), encoding="utf-8")
          token_file.chmod(0o600)
          (root / "dataset-metadata.json").write_text(json.dumps({
              "id": os.environ["KAGGLE_OWNER"] + "/humanoid-wandb-auth-" + os.environ["GITHUB_RUN_ID"],
              "title": "Humanoid W&B Auth " + os.environ["GITHUB_RUN_ID"],
              "licenses": [{"name": "other"}],
              "description": "Temporary PRIVATE credential for a single direct W&B Kaggle run. Must never be made public.",
          }))
          print("Prepared temporary account-private W&B credential (value not logged)")
          PY
          # Kaggle datasets are private unless --public is explicitly passed.
          kaggle datasets create -p wandb_private --keep-tabular -q
          rm -f wandb_private/wandb_auth_token.txt
          dataset="$KAGGLE_OWNER/humanoid-wandb-auth-$GITHUB_RUN_ID"
          for attempt in $(seq 1 12); do
            if kaggle datasets files "$dataset" > /tmp/wandb_files.txt 2>&1; then
              echo "Temporary private W&B credential dataset is accessible"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::W&B credential dataset was uploaded but is not accessible"
              exit 1
            fi
            sleep 10
          done
          sleep 10
      - name: Remove prior private single-run W&B credential
        run: |
          kaggle datasets delete "$KAGGLE_OWNER/humanoid-wandb-auth-43000807615" -y || true
      - name: Prepare private dual-T4 production kernel
        id: push
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("kaggle/production_kernel")
          metadata = json.loads((p/"kernel-metadata.json").read_text())
          kernel = os.environ["KAGGLE_OWNER"] + "/humanoid-patent-production-dual-t4"
          metadata.update({
            "id":kernel,
            "title":"Humanoid patent production dual T4",
            "code_file":"production.ipynb",
            "language":"python",
            "kernel_type":"notebook",
            "is_private":"true",
            "enable_gpu":"true",
            "enable_internet":"true",
            "machine_shape":"NvidiaTeslaT4",
            "dataset_sources":[
              os.environ["KAGGLE_OWNER"]+"/pplx-decider-flash-private-v12",
              os.environ["KAGGLE_OWNER"]+"/humanoid-production-resume-43012383316",
              os.environ["KAGGLE_OWNER"]+"/humanoid-wandb-auth-"+os.environ["GITHUB_RUN_ID"],
            ],
            "competition_sources":[],
            "kernel_sources":[],
            "model_sources":[],
          })
          metadata.pop("id_no",None)
          (p/"kernel-metadata.json").write_text(json.dumps(metadata,indent=2)+"\n")
          notebook = p/"production.ipynb"
          source = notebook.read_text()
          if source.count("REPLACE_GIT_SHA") != 1 or source.count("REPLACE_RUN_ID") != 1:
              raise RuntimeError("Expected exactly one source commit and direct-W&B-run placeholder")
          source = source.replace("REPLACE_GIT_SHA", os.environ["GITHUB_SHA"])
          source = source.replace("REPLACE_RUN_ID", os.environ["GITHUB_RUN_ID"])
          notebook.write_text(source)
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("kernel_id="+kernel+"\n")
          print("Prepared production notebook:",kernel,os.environ["GITHUB_SHA"])
          PY
      - name: Submit production kernel when a Kaggle GPU slot becomes available
        id: execution
        run: |
          set -euo pipefail
          submitted=0
          # Kaggle permits only two simultaneous batch GPU sessions. Prior
          # submissions are still occupying the slots. Do not delete any
          # notebook or guess session cancellation IDs.
          for attempt in $(seq 1 150); do
            kaggle kernels push -p kaggle/production_kernel --accelerator NvidiaTeslaT4 --timeout 21600 > /tmp/kaggle_submit.log 2>&1 || true
            if grep -Eq 'Kernel version [0-9]+ successfully pushed' /tmp/kaggle_submit.log; then
              cat /tmp/kaggle_submit.log
              submitted=1
              break
            fi
            if grep -q 'Maximum batch GPU session count of 2 reached' /tmp/kaggle_submit.log; then
              echo "KAGGLE_GPU_QUEUE attempt=$attempt/150 reason=two_other_batch_sessions_active"
              sleep 120
            else
              echo "::error::Kaggle kernel submission failed for an unexpected reason"
              tail -20 /tmp/kaggle_submit.log
              exit 1
            fi
          done
          if [ "$submitted" -ne 1 ]; then
            echo "::error::Kaggle GPU slots remained full throughout the bounded retry window"
            exit 1
          fi
          python - <<'PY'
          import os, re
          from pathlib import Path
          log = Path("/tmp/kaggle_submit.log").read_text(encoding="utf-8")
          match = re.search(r"https://www[.]kaggle[.]com/code/([A-Za-z0-9_-]+)/([A-Za-z0-9_-]+)", log)
          if not match:
              raise RuntimeError("Kaggle did not return a canonical notebook URL")
          url = match.group(0)
          print("PRODUCTION_KERNEL=" + url, flush=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
              file.write("kernel_id=" + "/".join(match.groups()) + chr(10))
          PY
      - name: Remove temporary W&B credential if submission failed
        if: failure()
        run: |
          if [ -n "$KAGGLE_OWNER" ]; then
            kaggle datasets delete "$KAGGLE_OWNER/humanoid-wandb-auth-$GITHUB_RUN_ID" -y || true
          fi

  monitor:
    needs: submit
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL_ID: ${{ needs.submit.outputs.kernel_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI for completion and artifact retrieval
        run: python -m pip install --disable-pip-version-check kaggle six
      - name: Track Kaggle session without relying on delayed Kaggle stdout
        run: |
          set -euo pipefail
          for attempt in $(seq 1 710); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL_ID" 2>&1)" || {
              echo "Transient Kaggle status request failure"
              sleep 30
              continue
            }
            if (( attempt % 10 == 1 )); then echo "KAGGLE_STATUS=$status"; fi
            if [[ "$status" == *"KernelWorkerStatus.COMPLETE"* ]]; then
              echo "KAGGLE_NOTEBOOK_FINISHED"
              exit 0
            fi
            if [[ "$status" == *"KernelWorkerStatus.ERROR"* || "$status" == *"KernelWorkerStatus.CANCELLED"* ]]; then
              echo "::error::Kaggle execution failed; check the notebook and diagnostics"
              kaggle kernels logs "$KAGGLE_KERNEL_ID" | tail -60 || true
              exit 1
            fi
            sleep 30
          done
          echo "::error::Kaggle did not finish during monitoring window"
          exit 1
      - name: Retrieve source-verified predictions or resumable journals
        if: always()
        run: |
          mkdir -p kaggle_results
          kaggle kernels output "$KAGGLE_KERNEL_ID" -p kaggle_results || true
          find kaggle_results -maxdepth 2 -type f -printf '%P: %s bytes\n'
      - name: Retain prediction results and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-dual-t4-production-output
          path: kaggle_results/
          retention-days: 30
          if-no-files-found: warn
      - name: Delete temporary Kaggle W&B credential dataset
        if: always()
        run: |
          owner="$(printf '%s' "$KAGGLE_KERNEL_ID" | cut -d/ -f1)"
          if [ -n "$owner" ]; then
            kaggle datasets delete "$owner/humanoid-wandb-auth-$GITHUB_RUN_ID" -y || true
          fi

  verify_wandb:
    needs: submit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      WANDB_BASE_URL: https://api.forge.coreweave.com
      WANDB_RUN_NAME: production-dual-t4-direct-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install W&B client
        run: python -m pip install --disable-pip-version-check wandb==0.31.0
      - name: Verify W&B receives real nonzero analyzed-document counts
        run: python -u kaggle/verify_wandb_live.py
