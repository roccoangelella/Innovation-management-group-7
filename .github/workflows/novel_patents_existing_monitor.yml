name: Monitor already-submitted novel Kaggle dual-T4 run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/novel_monitor_request.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: monitor-existing-novel-kaggle-43710347995
  cancel-in-progress: false

jobs:
  monitor_existing:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL_ID: roccoangelella/novel-humanoid-patent-production-dual-t4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle six
      - name: Restore validated 22,437-family translation from first successful run
        uses: actions/download-artifact@v4
        with:
          name: novel-translation-complete
          run-id: 43700985713
          github-token: ${{ github.token }}
          path: staged_input
      - name: Monitor exact already submitted Kaggle notebook, no GPU submission
        id: watch
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          for attempt in $(seq 1 680); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL_ID" 2>&1)" || {
              if (( attempt % 10 == 1 )); then echo "KAGGLE_STATUS_QUERY_RETRY=$attempt"; fi
              sleep 30
              continue
            }
            if (( attempt % 10 == 1 )); then
              echo "KAGGLE_STATUS=$status"
            fi
            if [[ "$status" == *"KernelWorkerStatus.COMPLETE"* ]]; then
              echo "KAGGLE_NOVEL_NOTEBOOK_COMPLETE"
              exit 0
            fi
            if [[ "$status" == *"KernelWorkerStatus.ERROR"* || "$status" == *"KernelWorkerStatus.CANCELLED"* ]]; then
              echo "::error::Kaggle novel notebook failed or cancelled; checking saved output"
              kaggle kernels logs "$KAGGLE_KERNEL_ID" | tail -80 || true
              exit 1
            fi
            sleep 30
          done
          echo "::error::Kaggle novel notebook not finished within monitoring window"
          exit 1
      - name: Retrieve completed predictions or resumable GPU journals
        if: always()
        run: |
          mkdir -p kaggle_results
          kaggle kernels output "$KAGGLE_KERNEL_ID" -p kaggle_results || true
          find kaggle_results -maxdepth 2 -type f -printf '%P: %s bytes\n'
      - name: Validate full screening against exact English artifact
        if: steps.watch.outcome == 'success'
        run: |
          python kaggle/validate_novel_output.py \
            staged_input/novel_humanoid_patents_en.csv \
            staged_input/novel_translation_summary.json \
            kaggle_results
      - name: Save audited outputs or recovery checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-screening-output-monitor-43710347995
          path: kaggle_results/
          retention-days: 30
          if-no-files-found: warn
