name: Mine humanoid challenge set candidates

on:
  push:
    branches: [main]
    paths:
      - "src/mine_challenge_candidates.py"
      - ".github/workflows/mine_challenge_candidates.yml"

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mine original English abstracts
        run: python3 src/mine_challenge_candidates.py
      - name: Commit inspection-only candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f samples/humanoid_challenge_100/candidate*
          if ! git diff --cached --quiet; then
            git commit -m "Generate humanoid challenge candidate pool [skip ci]"
            git push origin HEAD:main
          fi
