name: Kaggle dual-T4 notebook launch check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle_launch_check.yml"
      - "kaggle/launch_check/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-dual-t4-launch-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Kaggle CLI
        run: python -m pip install --disable-pip-version-check --upgrade kaggle six
      - name: Verify authentication secret, without displaying it
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "::error::KAGGLE_API_TOKEN is missing or empty in GitHub Actions secrets"
            exit 1
          fi
          echo "KAGGLE_API_TOKEN is configured (value not displayed)"
      - name: Initialize a private launch-check notebook
        id: prepare
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels init -p kaggle/launch_check
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("kaggle/launch_check/kernel-metadata.json")
          metadata = json.loads(p.read_text(encoding="utf-8"))
          initial = metadata.get("id", "")
          if "/" not in initial:
              raise RuntimeError("Kaggle CLI did not generate a user-owned kernel ID")
          owner = initial.split("/", 1)[0]
          if not owner or owner.lower() in {"username", "user", "your-username", "yourusername"}:
              raise RuntimeError("Kaggle CLI did not resolve the authenticated account owner")
          slug = "humanoid-dual-t4-launch-check"
          metadata.update({
              "id": owner + "/" + slug,
              "title": "Humanoid dual T4 launch check",
              "code_file": "launch_check.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "false",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          })
          metadata.pop("id_no", None)
          p.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("kernel_id=" + metadata["id"] + "\n")
          print("Prepared private Kaggle notebook under:", metadata["id"])
          PY
      - name: Push and request execution on dual T4
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p kaggle/launch_check --accelerator NvidiaTeslaT4
          echo "Kaggle accepted the notebook push command."
      - name: Check Kaggle execution status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_ID: ${{ steps.prepare.outputs.kernel_id }}
        run: |
          echo "Kaggle notebook URL: https://www.kaggle.com/code/$KERNEL_ID"
          for attempt in $(seq 1 18); do
            status=$(kaggle kernels status "$KERNEL_ID" 2>&1) || { echo "$status"; exit 1; }
            echo "Status check $attempt: $status"
            if echo "$status" | grep -Eiq "(complete|successful)"; then
              mkdir -p kaggle_launch_results
              kaggle kernels output "$KERNEL_ID" -p kaggle_launch_results --file-pattern 't4_launch_check.json'
              python - <<'PY'
          import json
          from pathlib import Path
          path = Path("kaggle_launch_results/t4_launch_check.json")
          if not path.is_file():
              raise RuntimeError("No diagnostic result returned by Kaggle")
          info = json.loads(path.read_text(encoding="utf-8"))
          print("Verified notebook GPU result:", json.dumps(info))
          if not (info.get("cuda_available") and info.get("gpu_count") == 2 and all("T4" in n for n in info.get("gpu_names", []))):
              raise RuntimeError("Notebook did not execute on dual NVIDIA T4 GPUs")
          PY
              exit 0
            fi
            if echo "$status" | grep -Eiq "(failed|error|cancelled)"; then
              echo "::error::Kaggle reported a failed notebook execution"
              kaggle kernels logs "$KERNEL_ID" || true
              exit 1
            fi
            sleep 15
          done
          echo "::error::Kaggle notebook did not complete within the launch-check polling window"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-dual-t4-launch-check
          path: kaggle_launch_results/t4_launch_check.json
          if-no-files-found: ignore
