name: Step 1 landscape preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/step1_*.py'
      - 'config/step1.json'
      - 'tests/test_step1.py'
      - 'requirements-step1.txt'
      - '.github/workflows/step1_preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-step1.txt
      - run: python -m unittest discover -s tests -p test_step1.py -v
      - run: python src/step1_landscape.py --semantic tfidf
      - uses: actions/upload-artifact@v4
        with:
          name: step1-source-preview
          path: outputs/step1_preview/
