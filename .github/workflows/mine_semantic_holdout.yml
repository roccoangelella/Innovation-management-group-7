name: Mine semantic humanoid holdout candidates

on:
  push:
    branches: [main]
    paths:
      - "src/mine_keyword_blind_candidates.py"
      - ".github/workflows/mine_semantic_holdout.yml"

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mine keyword-blind candidate families from source ZIP
        run: python3 src/mine_keyword_blind_candidates.py
      - name: Commit inspection pool and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f samples/humanoid_semantic_holdout_100/candidate_pool.jsonl samples/humanoid_semantic_holdout_100/candidate_index.csv samples/humanoid_semantic_holdout_100/candidate_summary.json samples/humanoid_semantic_holdout_100/review_*.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Generate keyword-blind humanoid challenge candidate pool [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
